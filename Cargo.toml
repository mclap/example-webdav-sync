[package]
name = "webdav-sync"
version = "0.1.0"
edition = "2021"
description = "Bidirectional directory sync service via WebDAV in Rust"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "gzip", "rustls-tls"] }
quick-xml = { version = "0.36", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
walkdir = "2"
futures = "0.3"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6"
notify-debouncer-mini = "0.4"
tokio-util = "0.7"
bytes = "1"
async-trait = "0.1"
url = "2"
percent-encoding = "2"
dialoguer = "0.11"
dirs = "5"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
